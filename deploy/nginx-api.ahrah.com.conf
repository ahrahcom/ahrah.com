# /etc/nginx/conf.d/ahrah-api.conf
#
# HTTPS for api.ahrah.com must be its own server block.
# Do not add api.ahrah.com to cliaces.conf — that sends traffic to :5000
# and the contact form gets 403 Forbidden from Cliaces.
#
# Certbot already issued the cert. If nginx -t says the pem files are missing:
#   sudo ls /etc/letsencrypt/live/
# and fix the two ssl_certificate paths.

server {
    listen 443 ssl;
    http2 on;
    server_name api.ahrah.com;

    ssl_certificate /etc/letsencrypt/live/api.ahrah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ahrah.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}

server {
    listen 80;
    server_name api.ahrah.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
